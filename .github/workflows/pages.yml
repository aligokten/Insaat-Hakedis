name: GitHub Pages

# Pages yayın kaynağı: gh-pages dalı.
# main'e yapılan her push'ta site içeriği gh-pages dalına yansıtılır.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gh-pages dalını güncelle
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f gh-pages HEAD
          git push --force origin gh-pages
