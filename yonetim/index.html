<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villa Proje Yönetimi</title>
<meta name="description" content="Anahtar teslim villa projeleri için maliyet, hakediş, iş takip, tedarik, sipariş ve cari yönetim programı.">
<style>
:root{
  --arka:#f4f6f9; --panel:#ffffff; --panel2:#fafbfd;
  --yazi:#15202b; --soluk:#6b7a8d; --cizgi:#e2e8f0;
  --vurgu:#0f62d6; --vurgu-yazi:#ffffff; --vurgu-soft:#e8f0fe;
  --yesil:#0f9d58; --yesil-soft:#e6f6ee;
  --sari:#b7791f; --sari-soft:#fdf3e0;
  --kirmizi:#d33a3a; --kirmizi-soft:#fdeaea;
  --mor:#6b46c1; --mor-soft:#efe9fb;
  --golge:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  --r:10px; --r-s:7px;
  --yazitipi:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--arka);color:var(--yazi);font-family:var(--yazitipi);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--vurgu);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}

/* ---------- yerleşim ---------- */
.kabuk{display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr;min-height:100vh;grid-template-areas:"ustbar ustbar" "menu icerik"}
.ustbar{grid-area:ustbar;display:flex;align-items:center;gap:16px;padding:0 18px;height:58px;background:var(--panel);border-bottom:1px solid var(--cizgi);position:sticky;top:0;z-index:30}
.marka{display:flex;align-items:center;gap:10px;min-width:200px}
.marka-ikon{width:32px;height:32px;border-radius:9px;background:var(--vurgu);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.marka b{display:block;font-size:14.5px;line-height:1.1}
.marka small{color:var(--soluk);font-size:11.5px}
.ustbar-sag{margin-left:auto;display:flex;align-items:center;gap:8px}
.proje-secici{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--cizgi);border-radius:var(--r-s);padding:5px 8px}
.proje-secici span{color:var(--soluk);font-size:12px}
.proje-secici select{border:0;background:transparent;font-weight:600;max-width:230px;outline:none}

.menu{grid-area:menu;background:var(--panel);border-right:1px solid var(--cizgi);padding:12px 10px;overflow:auto}
.menu-baslik{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--soluk);margin:14px 8px 6px}
.menu a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-s);color:var(--yazi);font-weight:500;margin-bottom:2px}
.menu a:hover{background:var(--panel2)}
.menu a.aktif{background:var(--vurgu-soft);color:var(--vurgu);font-weight:600}
.menu a .mi{width:18px;text-align:center;font-size:15px}
.menu a .rozet{margin-left:auto;background:var(--kirmizi-soft);color:var(--kirmizi);border-radius:20px;padding:0 7px;font-size:11px;font-weight:700}

.icerik{grid-area:icerik;padding:18px 20px 60px;overflow:auto}
.sayfa-bas{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sayfa-bas h1{margin:0;font-size:21px;letter-spacing:-.01em}
.sayfa-bas p{margin:2px 0 0;color:var(--soluk);font-size:13px}
.sayfa-bas .islemler{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- kartlar ---------- */
.kart{background:var(--panel);border:1px solid var(--cizgi);border-radius:var(--r);box-shadow:var(--golge)}
.kart-bas{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--cizgi)}
.kart-bas h2{margin:0;font-size:14.5px}
.kart-bas .islemler{margin-left:auto;display:flex;gap:6px}
.kart-govde{padding:14px}
.izgara{display:grid;gap:14px}
.i2{grid-template-columns:repeat(2,minmax(0,1fr))}
.i3{grid-template-columns:repeat(3,minmax(0,1fr))}
.i4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.i4{grid-template-columns:repeat(2,minmax(0,1fr))}.i3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.kabuk{grid-template-columns:1fr;grid-template-areas:"ustbar" "icerik"}.menu{display:none}.menu.acik{display:block;position:fixed;inset:58px auto 0 0;width:240px;z-index:40;box-shadow:var(--golge)}.i2,.i3,.i4{grid-template-columns:1fr}}

.kutu{background:var(--panel);border:1px solid var(--cizgi);border-radius:var(--r);padding:14px;box-shadow:var(--golge)}
.kutu .etiket{color:var(--soluk);font-size:12px;display:flex;align-items:center;gap:6px}
.kutu .deger{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kutu .alt{color:var(--soluk);font-size:12px;margin-top:4px}
.kutu.vurgulu{border-color:var(--vurgu);box-shadow:0 0 0 3px var(--vurgu-soft)}

/* ---------- butonlar ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--cizgi);background:var(--panel);color:var(--yazi);padding:7px 12px;border-radius:var(--r-s);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.ana{background:var(--vurgu);border-color:var(--vurgu);color:var(--vurgu-yazi)}
.btn.ana:hover{filter:brightness(1.07)}
.btn.tehlike{color:var(--kirmizi);border-color:#f3c9c9}
.btn.tehlike:hover{background:var(--kirmizi-soft)}
.btn.kucuk{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- form ---------- */
.form-izgara{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-izgara .tam{grid-column:1/-1}
@media(max-width:640px){.form-izgara{grid-template-columns:1fr}}
.alan{display:flex;flex-direction:column;gap:5px}
.alan>label{font-size:12.5px;font-weight:600;color:var(--soluk)}
.alan input,.alan select,.alan textarea{border:1px solid var(--cizgi);border-radius:var(--r-s);padding:8px 10px;background:var(--panel);outline:none;width:100%}
.alan input:focus,.alan select:focus,.alan textarea:focus{border-color:var(--vurgu);box-shadow:0 0 0 3px var(--vurgu-soft)}
.alan textarea{min-height:74px;resize:vertical}
.alan .ipucu{font-size:11.5px;color:var(--soluk)}
input[type=number]{font-variant-numeric:tabular-nums}

/* ---------- tablo ---------- */
.tablo-sar{overflow:auto;border-radius:var(--r)}
table.tablo{width:100%;border-collapse:collapse;font-size:13.2px}
table.tablo th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--soluk);padding:9px 10px;border-bottom:1px solid var(--cizgi);white-space:nowrap}
table.tablo td{padding:9px 10px;border-bottom:1px solid var(--cizgi);vertical-align:middle}
table.tablo tr:last-child td{border-bottom:0}
table.tablo tbody tr:hover{background:var(--panel2)}
table.tablo th.sol,table.tablo td.sol{text-align:left}
table.tablo th.sag,table.tablo td.sag{text-align:right;font-variant-numeric:tabular-nums}
table.tablo td.islem{text-align:right;white-space:nowrap}
table.tablo tfoot td{background:var(--panel2);font-weight:700;border-top:2px solid var(--cizgi)}
.bos{padding:34px 14px;text-align:center;color:var(--soluk)}
.bos b{display:block;color:var(--yazi);margin-bottom:4px}

/* ---------- etiket / rozet ---------- */
.rz{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--panel2);color:var(--soluk);border:1px solid var(--cizgi);white-space:nowrap}
.rz.yesil{background:var(--yesil-soft);color:var(--yesil);border-color:transparent}
.rz.sari{background:var(--sari-soft);color:var(--sari);border-color:transparent}
.rz.kirmizi{background:var(--kirmizi-soft);color:var(--kirmizi);border-color:transparent}
.rz.mavi{background:var(--vurgu-soft);color:var(--vurgu);border-color:transparent}
.rz.mor{background:var(--mor-soft);color:var(--mor);border-color:transparent}

/* ---------- ilerleme ---------- */
.ilerleme{height:7px;background:var(--cizgi);border-radius:20px;overflow:hidden;min-width:70px}
.ilerleme i{display:block;height:100%;background:var(--vurgu);border-radius:20px}
.ilerleme.yesil i{background:var(--yesil)}
.ilerleme.kirmizi i{background:var(--kirmizi)}
.cubuk-satir{display:flex;align-items:center;gap:8px}
.cubuk-satir span{font-size:12px;color:var(--soluk);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}

/* ---------- araç çubuğu ---------- */
.arac{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.arac input[type=search],.arac select{border:1px solid var(--cizgi);border-radius:var(--r-s);padding:7px 10px;background:var(--panel);outline:none}
.arac input[type=search]{min-width:230px}
.arac .say{margin-right:auto;color:var(--soluk);font-size:12.5px}

/* ---------- modal ---------- */
.ortu{position:fixed;inset:0;background:rgba(15,23,32,.45);display:grid;place-items:center;padding:18px;z-index:80}
.modal{background:var(--panel);border-radius:14px;width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(16,24,40,.28)}
.modal-bas{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--cizgi)}
.modal-bas h3{margin:0;font-size:16px}
.modal-bas .kapat{margin-left:auto;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--soluk)}
.modal-govde{padding:16px;overflow:auto}
.modal-alt{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--cizgi)}
.modal-alt .sol-taraf{margin-right:auto}

/* ---------- bildirim ---------- */
.bildirimler{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:90}
.bildirim{background:var(--yazi);color:#fff;padding:10px 14px;border-radius:var(--r-s);box-shadow:var(--golge);font-size:13px;animation:gir .18s ease}
.bildirim.hata{background:var(--kirmizi)}
.bildirim.basari{background:var(--yesil)}
@keyframes gir{from{opacity:0;transform:translateY(6px)}}

/* ---------- çeşitli ---------- */
.satir-arasi{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kucuk-yazi{font-size:12px;color:var(--soluk)}
.bolum-baslik{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--soluk);margin:16px 0 8px}
.sekmeler{display:flex;gap:4px;border-bottom:1px solid var(--cizgi);margin-bottom:14px;flex-wrap:wrap}
.sekmeler button{border:0;background:transparent;padding:9px 13px;cursor:pointer;font-weight:600;color:var(--soluk);border-bottom:2px solid transparent;margin-bottom:-1px}
.sekmeler button.aktif{color:var(--vurgu);border-bottom-color:var(--vurgu)}
.liste-bos{color:var(--soluk);font-size:13px;padding:10px 0}
.mini-tablo td{padding:5px 0;font-size:13px}
.mini-tablo td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.menu-ac{display:none;border:1px solid var(--cizgi);background:var(--panel);border-radius:var(--r-s);padding:6px 10px;cursor:pointer}
@media(max-width:760px){.menu-ac{display:block}.proje-secici select{max-width:130px}}
.zaman-cubuk{position:relative;height:22px;background:var(--panel2);border-radius:6px;overflow:hidden;min-width:160px}
.zaman-cubuk i{position:absolute;top:3px;bottom:3px;background:var(--vurgu);border-radius:5px;opacity:.85}
.zaman-cubuk.gecikmis i{background:var(--kirmizi)}
.zaman-cubuk.bitti i{background:var(--yesil)}
.site-alt{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--cizgi);background:var(--panel);color:var(--soluk);font-size:12px}
@media print{.menu,.ustbar,.site-alt,.sayfa-bas .islemler,.arac{display:none!important}.kabuk{display:block}.icerik{padding:0}}
</style>
</head>
<body>
<div id="kok"></div>
<footer class="site-alt" id="site-alt">
  <span><b>Villa Proje Yönetimi</b> · Anahtar teslim maliyet, hakediş, tedarik ve iş takip programı</span>
  <span>Lisans sahibi: Ali Gökten · SAGG+ App</span>
</footer>
<div class="bildirimler" id="bildirimler"></div>
<script>
"use strict";
/* =======================================================================
   Villa Proje Yönetimi - bağımsız tek dosya uygulama
   Veri: tarayıcı localStorage + JSON yedek
   ======================================================================= */

/* ----------------------- yardımcılar ----------------------- */
const $ = (s, k = document) => k.querySelector(s);
const el = (etiket, ozellik = {}, ...cocuklar) => {
  const d = document.createElement(etiket);
  for (const [a, v] of Object.entries(ozellik)) {
    if (v === null || v === undefined || v === false) continue;
    if (a === "class") d.className = v;
    else if (a === "html") d.innerHTML = v;
    else if (a === "text") d.textContent = v;
    else if (a.startsWith("on") && typeof v === "function") d.addEventListener(a.slice(2), v);
    else if (a === "data") Object.assign(d.dataset, v);
    else d.setAttribute(a, v);
  }
  for (const c of cocuklar.flat()) {
    if (c === null || c === undefined || c === false) continue;
    d.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
  }
  return d;
};
const kimlik = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sayi = (v) => {
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (!v) return 0;
  const t = String(v).replace(/\s/g, "").replace(/\./g, "").replace(",", ".");
  const n = parseFloat(t);
  return isFinite(n) ? n : 0;
};
const paraBicim = new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const adetBicim = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 3 });
const para = (v) => paraBicim.format(sayi(v)) + " ₺";
const paraKisa = (v) => {
  const n = sayi(v), m = Math.abs(n);
  if (m >= 1e9) return (n / 1e9).toFixed(2).replace(".", ",") + " Mr ₺";
  if (m >= 1e6) return (n / 1e6).toFixed(2).replace(".", ",") + " M ₺";
  if (m >= 1e4) return Math.round(n / 1e3).toLocaleString("tr-TR") + " B ₺";
  return para(n);
};
const adet = (v) => adetBicim.format(sayi(v));
const yuzde = (v) => adetBicim.format(Math.round(sayi(v) * 10) / 10) + "%";
const bugun = () => new Date().toISOString().slice(0, 10);
const tarih = (t) => (t ? new Date(t + "T00:00:00").toLocaleDateString("tr-TR") : "—");
const gunFarki = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const kacir = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toplam = (dizi, f) => dizi.reduce((t, x) => t + sayi(f(x)), 0);
const grupla = (dizi, f) => dizi.reduce((o, x) => { const k = f(x); (o[k] = o[k] || []).push(x); return o; }, {});

function bildir(mesaj, tur = "") {
  const b = el("div", { class: "bildirim " + tur, text: mesaj });
  $("#bildirimler").appendChild(b);
  setTimeout(() => { b.style.opacity = "0"; b.style.transition = "opacity .3s"; setTimeout(() => b.remove(), 320); }, 2600);
}

/* ----------------------- sabit listeler ----------------------- */
const CARI_TURU = {
  taseron:   { ad: "Taşeron",              renk: "mavi" },
  tedarikci: { ad: "Malzeme Tedarikçisi",  renk: "mor" },
  isci:      { ad: "İşçi / Usta",          renk: "yesil" },
  nakliye:   { ad: "Nakliyeci",            renk: "sari" },
  kiralama:  { ad: "İş Makinesi / Kiralama", renk: "" },
  musavir:   { ad: "Müşavir / Proje Ofisi", renk: "" },
  diger:     { ad: "Diğer",                renk: "" },
};
const PROJE_DURUMU = {
  planlama: { ad: "Planlama", renk: "sari" },
  devam:    { ad: "Devam Ediyor", renk: "mavi" },
  duraklatildi: { ad: "Duraklatıldı", renk: "kirmizi" },
  tamam:    { ad: "Tamamlandı", renk: "yesil" },
};
const IS_DURUMU = {
  bekliyor: { ad: "Bekliyor", renk: "" },
  devam:    { ad: "Devam Ediyor", renk: "mavi" },
  tamam:    { ad: "Tamamlandı", renk: "yesil" },
  iptal:    { ad: "İptal", renk: "kirmizi" },
};
const HAKEDIS_DURUMU = {
  taslak:  { ad: "Taslak", renk: "" },
  onayda:  { ad: "Onayda", renk: "sari" },
  onayli:  { ad: "Onaylandı", renk: "mavi" },
  odendi:  { ad: "Ödendi", renk: "yesil" },
};
const SIPARIS_DURUMU = {
  talep:  { ad: "Talep", renk: "" },
  siparis:{ ad: "Sipariş Verildi", renk: "mavi" },
  yolda:  { ad: "Yolda", renk: "sari" },
  kismi:  { ad: "Kısmi Teslim", renk: "sari" },
  teslim: { ad: "Teslim Alındı", renk: "yesil" },
  iptal:  { ad: "İptal", renk: "kirmizi" },
};
const ONCELIK = { dusuk: { ad: "Düşük", renk: "" }, normal: { ad: "Normal", renk: "mavi" }, yuksek: { ad: "Yüksek", renk: "sari" }, kritik: { ad: "Kritik", renk: "kirmizi" } };
const IMALAT_GRUPLARI = [
  "Arsa ve Ruhsat", "Hafriyat ve Zemin", "Kaba Yapı - Betonarme", "Çatı", "Duvar ve Sıva",
  "Yalıtım", "Mekanik Tesisat", "Elektrik Tesisatı", "Kapı ve Pencere (Doğrama)",
  "Zemin Kaplama", "Duvar Kaplama ve Boya", "Mutfak ve Banyo", "Havuz ve Peyzaj",
  "Cephe", "Genel Giderler", "Diğer",
];
const BIRIMLER = ["m²", "m³", "m", "adet", "kg", "ton", "takım", "gün", "saat", "paket", "lt", "götürü"];
const ODEME_YONTEMI = ["Havale/EFT", "Nakit", "Çek", "Senet", "Kredi Kartı", "Mahsup"];

/* ----------------------- veri katmanı ----------------------- */
const ANAHTAR = "villa-yonetim-v1";
const BOS_VERI = () => ({
  surum: 1,
  projeler: [], cariler: [], kalemler: [], sozlesmeler: [],
  hakedisler: [], odemeler: [], siparisler: [], isler: [], masraflar: [],
  ayar: { aktifProje: "", firmaAdi: "" },
});
let VERI = BOS_VERI();

function yukle() {
  try {
    const ham = localStorage.getItem(ANAHTAR);
    if (ham) {
      const o = JSON.parse(ham);
      VERI = Object.assign(BOS_VERI(), o);
      VERI.ayar = Object.assign(BOS_VERI().ayar, o.ayar || {});
    }
  } catch (e) { console.warn("Veri okunamadı:", e); }
}
let kayitZaman = null;
function kaydet() {
  clearTimeout(kayitZaman);
  kayitZaman = setTimeout(() => {
    try { localStorage.setItem(ANAHTAR, JSON.stringify(VERI)); }
    catch (e) { bildir("Kayıt yapılamadı: depolama dolu olabilir.", "hata"); }
  }, 60);
}
const tablo = (ad) => (VERI[ad] = VERI[ad] || []);
function ekle(ad, nesne) { const k = Object.assign({ id: kimlik(), olusturma: new Date().toISOString() }, nesne); tablo(ad).push(k); kaydet(); return k; }
function guncelle(ad, id, yama) { const k = tablo(ad).find((x) => x.id === id); if (k) { Object.assign(k, yama); kaydet(); } return k; }
function sil(ad, id) { VERI[ad] = tablo(ad).filter((x) => x.id !== id); kaydet(); }
const bul = (ad, id) => tablo(ad).find((x) => x.id === id);
const projeAdi = (id) => (bul("projeler", id) || {}).ad || "—";
const cariAdi = (id) => (bul("cariler", id) || {}).ad || "—";

/* ----------------------- hesaplamalar ----------------------- */
function hakedisHesapla(h) {
  const brut = (h.satirlar && h.satirlar.length)
    ? toplam(h.satirlar, (s) => sayi(s.miktar) * sayi(s.birimFiyat))
    : sayi(h.brut);
  const k = h.kesinti || {};
  const teminat = brut * sayi(k.teminatOrani) / 100;
  const stopaj  = brut * sayi(k.stopajOrani) / 100;
  const avans   = sayi(k.avans);
  const digerK  = sayi(k.diger);
  const kesintiToplam = teminat + stopaj + avans + digerK;
  return { brut, teminat, stopaj, avans, diger: digerK, kesintiToplam, net: brut - kesintiToplam };
}
const hakedisNet = (h) => hakedisHesapla(h).net;
const siparisTutar = (s) => sayi(s.miktar) * sayi(s.birimFiyat);
const kalemTutar = (k) => sayi(k.miktar) * sayi(k.birimFiyat);

function projeOzet(projeId) {
  const f = (ad) => tablo(ad).filter((x) => x.projeId === projeId);
  const kalemler = f("kalemler"), sozlesmeler = f("sozlesmeler"), hakedisler = f("hakedisler");
  const odemeler = f("odemeler"), siparisler = f("siparisler"), isler = f("isler"), masraflar = f("masraflar");
  const p = bul("projeler", projeId) || {};

  const butce = toplam(kalemler, kalemTutar);
  const sozlesmeToplam = toplam(sozlesmeler, (s) => s.tutar);
  const hakedisBrut = toplam(hakedisler, (h) => hakedisHesapla(h).brut);
  const hakedisNetT = toplam(hakedisler, hakedisNet);
  const siparisToplam = toplam(siparisler.filter((s) => s.durum !== "iptal"), siparisTutar);
  const masrafToplam = toplam(masraflar, (m) => m.tutar);
  const odenen = toplam(odemeler, (o) => o.tutar);
  const gerceklesen = hakedisNetT + siparisToplam + masrafToplam;
  const borc = gerceklesen - odenen;
  const satisBedeli = sayi(p.satisBedeli);

  const isAgirlikli = isler.length ? toplam(isler, (i) => sayi(i.ilerleme)) / isler.length : 0;
  const fizikselIlerleme = isler.length ? isAgirlikli : (butce ? Math.min(100, hakedisBrut / butce * 100) : 0);

  return {
    proje: p, butce, sozlesmeToplam, hakedisBrut, hakedisNet: hakedisNetT, siparisToplam,
    masrafToplam, odenen, gerceklesen, borc, kalanButce: butce - gerceklesen, satisBedeli,
    kar: satisBedeli ? satisBedeli - gerceklesen : 0,
    fizikselIlerleme,
    sayilar: {
      kalem: kalemler.length, sozlesme: sozlesmeler.length, hakedis: hakedisler.length,
      siparis: siparisler.length, is: isler.length,
      acikIs: isler.filter((i) => i.durum !== "tamam" && i.durum !== "iptal").length,
      gecikenIs: isler.filter((i) => i.durum !== "tamam" && i.durum !== "iptal" && i.bitis && i.bitis < bugun()).length,
      bekleyenSiparis: siparisler.filter((s) => ["talep", "siparis", "yolda", "kismi"].includes(s.durum)).length,
      odenmemisHakedis: hakedisler.filter((h) => h.durum !== "odendi").length,
    },
  };
}

function cariOzet(cariId, projeId = "") {
  const sz = (x) => (!projeId || x.projeId === projeId);
  const hakedisler = tablo("hakedisler").filter((h) => h.cariId === cariId && sz(h));
  const siparisler = tablo("siparisler").filter((s) => s.cariId === cariId && s.durum !== "iptal" && sz(s));
  const odemeler = tablo("odemeler").filter((o) => o.cariId === cariId && sz(o));
  const sozlesmeler = tablo("sozlesmeler").filter((s) => s.cariId === cariId && sz(s));
  const alacak = toplam(hakedisler, hakedisNet) + toplam(siparisler, siparisTutar);
  const odenen = toplam(odemeler, (o) => o.tutar);
  return { hakedisler, siparisler, odemeler, sozlesmeler, alacak, odenen, bakiye: alacak - odenen };
}

/* ----------------------- modal ve form motoru ----------------------- */
function modalAc({ baslik, govde, altKisim, genis }) {
  const ortu = el("div", { class: "ortu" });
  const kapat = () => { ortu.remove(); document.removeEventListener("keydown", esc); };
  const esc = (e) => { if (e.key === "Escape") kapat(); };
  document.addEventListener("keydown", esc);
  ortu.addEventListener("mousedown", (e) => { if (e.target === ortu) kapat(); });
  const m = el("div", { class: "modal" },
    el("div", { class: "modal-bas" }, el("h3", { text: baslik }), el("button", { class: "kapat", type: "button", "aria-label": "Kapat", onclick: kapat }, "×")),
    el("div", { class: "modal-govde" }, govde),
    altKisim ? el("div", { class: "modal-alt" }, altKisim) : null
  );
  if (genis) m.style.width = "min(" + genis + "px,100%)";
  ortu.appendChild(m);
  document.body.appendChild(ortu);
  const ilk = m.querySelector("input,select,textarea");
  if (ilk) setTimeout(() => ilk.focus(), 30);
  return { kapat, govde: m.querySelector(".modal-govde") };
}

function onayAl(mesaj, tamam) {

    altKisim: [
      el("button", { class: "btn", type: "button", onclick: () => kapat() }, "Vazgeç"),

}

function alanCiz(a, deger) {
  let giris;
  const ortak = { name: a.ad, id: "alan-" + a.ad };
  if (a.tip === "secim") {
    giris = el("select", ortak, ...(a.bos !== false ? [el("option", { value: "" }, a.bosYazi || "— seçiniz —")] : []),
      ...a.secenekler.map((s) => el("option", { value: s.d }, s.e)));
    giris.value = deger ?? "";
  } else if (a.tip === "metinKutu") {
    giris = el("textarea", ortak); giris.value = deger ?? "";
  } else if (a.tip === "onay") {
    giris = el("input", Object.assign({ type: "checkbox" }, ortak));
    giris.checked = !!deger;
    giris.style.width = "18px"; giris.style.height = "18px";
  } else {
    const tipler = { sayi: "number", para: "number", tarih: "date", eposta: "email", telefon: "tel" };
    giris = el("input", Object.assign({ type: tipler[a.tip] || "text" }, ortak));
    if (a.tip === "sayi" || a.tip === "para") { giris.step = a.adim || "0.01"; }
    if (a.liste) {
      const lid = "liste-" + a.ad + "-" + kimlik();
      giris.setAttribute("list", lid);
      giris.dataset.liste = lid;
      giris._liste = el("datalist", { id: lid }, ...a.liste.map((v) => el("option", { value: v })));
    }
    giris.value = deger ?? "";
  }
  if (a.gerekli) giris.required = true;
  if (a.salt) giris.disabled = true;
  if (a.yerTutucu) giris.placeholder = a.yerTutucu;
  const sarmal = el("div", { class: "alan" + (a.tam ? " tam" : "") },
    el("label", { for: ortak.id, text: a.etiket + (a.gerekli ? " *" : "") }),
    giris, giris._liste || null,
    a.ipucu ? el("div", { class: "ipucu", text: a.ipucu }) : null);
  if (a.tam) sarmal.classList.add("tam");
  return sarmal;
}

function formAc({ baslik, alanlar, kayit = {}, genis = 760, kaydet: kaydetFn, ekBolum }) {
  const form = el("form", { class: "form-izgara" });
  alanlar.forEach((a) => {
    if (a.baslik) { form.appendChild(el("div", { class: "bolum-baslik tam", text: a.baslik })); return; }
    form.appendChild(alanCiz(a, kayit[a.ad] ?? a.varsayilan ?? ""));
  });
  if (ekBolum) form.appendChild(ekBolum);
  const { kapat } = modalAc({
    baslik, genis, govde: form,
    altKisim: [
      el("button", { class: "btn", type: "button", onclick: () => kapat() }, "Vazgeç"),
      el("button", { class: "btn ana", type: "button", onclick: () => gonder() }, "Kaydet"),
    ],
  });
  form.addEventListener("submit", (e) => { e.preventDefault(); gonder(); });
  form.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") { e.preventDefault(); gonder(); } });
  function gonder() {
    if (!form.reportValidity()) return;
    const cikti = {};
    alanlar.forEach((a) => {
      if (a.baslik || a.salt) return;
      const g = form.elements[a.ad];
      if (!g) return;
      if (a.tip === "onay") cikti[a.ad] = g.checked;
      else if (a.tip === "sayi" || a.tip === "para") cikti[a.ad] = sayi(g.value);
      else cikti[a.ad] = g.value.trim ? g.value.trim() : g.value;
    });
    const sonuc = kaydetFn(cikti, form);
    if (sonuc !== false) { kapat(); ciz(); }
  }
  return { kapat, form };
}

/* ----------------------- tablo motoru ----------------------- */
function tabloCiz({ sutunlar, satirlar, bosMesaj = "Henüz kayıt yok.", bosEk, altToplam }) {
  if (!satirlar.length) {
    return el("div", { class: "bos" }, el("b", { text: bosMesaj }), bosEk || null);
  }
  const thead = el("thead", {}, el("tr", {}, ...sutunlar.map((s) => el("th", { class: s.sinif || "" }, s.baslik))));
  const tbody = el("tbody", {}, ...satirlar.map((r, i) => el("tr", {}, ...sutunlar.map((s) => {
    const icerik = s.hucre(r, i);
    const td = el("td", { class: s.sinif || "" });
    if (icerik instanceof Node) td.appendChild(icerik);
    else td.innerHTML = icerik ?? "";
    return td;
  }))));
  const t = el("table", { class: "tablo" }, thead, tbody);
  if (altToplam) {
    t.appendChild(el("tfoot", {}, el("tr", {}, ...sutunlar.map((s) => {
      const v = altToplam[s.anahtar];
      return el("td", { class: s.sinif || "" }, v === undefined ? "" : v);
    }))));
  }
  return el("div", { class: "tablo-sar" }, t);
}

function grupMaliyetCiz(pid) {
  const kalemler = tablo("kalemler").filter((x) => x.projeId === pid);
  const gercek = {};
  tablo("hakedisler").filter((h) => h.projeId === pid).forEach((h) => {
    const g = (bul("sozlesmeler", h.sozlesmeId) || {}).grup || "Diğer";
    gercek[g] = (gercek[g] || 0) + hakedisHesapla(h).net;
  });
  tablo("siparisler").filter((s) => s.projeId === pid && s.durum !== "iptal").forEach((s) => {
    const g = s.grup || "Diğer"; gercek[g] = (gercek[g] || 0) + siparisTutar(s);
  });
  tablo("masraflar").filter((m) => m.projeId === pid).forEach((m) => {
    const g = m.grup || "Genel Giderler"; gercek[g] = (gercek[g] || 0) + sayi(m.tutar);
  });
  const butceG = {};
  kalemler.forEach((x) => { const g = x.grup || "Diğer"; butceG[g] = (butceG[g] || 0) + kalemTutar(x); });
  const gruplar = [...new Set([...Object.keys(butceG), ...Object.keys(gercek)])]
    .map((g) => ({ g, b: butceG[g] || 0, r: gercek[g] || 0 }))
    .sort((a, b) => (b.b + b.r) - (a.b + a.r));
  if (!gruplar.length) return el("div", { class: "liste-bos", text: "Bütçe kalemi veya maliyet hareketi girilmedi." });
  const enBuyuk = Math.max(...gruplar.map((x) => Math.max(x.b, x.r))) || 1;
  return el("div", {}, ...gruplar.map((x) => el("div", { style: "margin-bottom:11px" },
    el("div", { class: "satir-arasi", style: "justify-content:space-between;font-size:12.5px" },
      el("span", { text: x.g }),
      el("span", { class: "kucuk-yazi", text: paraKisa(x.r) + " / " + paraKisa(x.b) })),
    el("div", { class: "ilerleme", style: "margin-top:4px" }, el("i", { style: "width:" + (x.b / enBuyuk * 100) + "%;background:var(--cizgi)" })),
    el("div", { class: "ilerleme", style: "margin-top:3px" }, el("i", { style: "width:" + (x.r / enBuyuk * 100) + "%;background:" + (x.b && x.r > x.b ? "var(--kirmizi)" : "var(--vurgu)") })))));
}

function isOzetCiz(pid) {

function hakedisFormu(kayit, sozlesme) {

    projeId: (sozlesme && sozlesme.projeId) || varsayilanProje(),

    no: "", tarih: bugun(), donem: "", durum: "taslak", aciklama: "",

    kesinti: { teminatOrani: sozlesme ? sayi(sozlesme.teminatOrani) : 5, stopajOrani: sozlesme ? sayi(sozlesme.stopajOrani) : 0, avans: 0, diger: 0 },
  }, kayit ? JSON.parse(JSON.stringify(kayit)) : {});
  if (!k.kesinti) k.kesinti = { teminatOrani: 0, stopajOrani: 0, avans: 0, diger: 0 };
  if (!k.satirlar) k.satirlar = [];

  if (!kayit && k.sozlesmeId) {

      k.kesinti.teminatOrani = sayi(s.teminatOrani);
      k.kesinti.stopajOrani = sayi(s.stopajOrani);

  }
  function formCiz() {

    const alanlar = [
      { ad: "projeId", etiket: "Proje", tip: "secim", bos: false, gerekli: true, secenekler: projeSecenek() },
      { ad: "sozlesmeId", etiket: "Sözleşme", tip: "secim", bosYazi: "— sözleşmesiz (doğrudan) —",
        secenekler: tablo("sozlesmeler").filter((s) => s.projeId === k.projeId).map((s) => ({ d: s.id, e: s.konu + " · " + cariAdi(s.cariId) })) },
      { ad: "cariId", etiket: "Hakediş Sahibi (cari)", tip: "secim", gerekli: true, secenekler: cariSecenek() },
      { ad: "no", etiket: "Hakediş No", gerekli: true },

      { ad: "donem", etiket: "Dönem / Açıklama", yerTutucu: "Örn: Mart 2026 - 2. hakediş" },

    ];
    alanlar.forEach((a) => ustForm.appendChild(alanCiz(a, k[a.ad])));
    ustForm.querySelector("[name=projeId]").addEventListener("change", (e) => { k.projeId = e.target.value; formCiz(); });

      el("span", { class: "kucuk-yazi", text: "Satır girilmezse aşağıdaki brüt tutar kullanılır." })));

  function butcedenAktar() {
